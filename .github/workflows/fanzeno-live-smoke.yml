name: Fanzeno public publication probe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce_publication:
        description: Fail if the public site does not show this release
        required: false
        default: false
        type: boolean

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Fanzeno site and release marker
        env:
          FANZENO_LIVE_URL: https://amerfangame.lovable.app
          ENFORCE_LIVE: ${{ inputs.enforce_publication && 'true' || 'false' }}
        run: node scripts/smoke-fanzeno-live.mjs
      - name: Preserve public smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanzeno-live-probe
          path: fanzeno-live-smoke.json
          if-no-files-found: warn
